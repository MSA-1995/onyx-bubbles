<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أفلام</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d17;color:#fff;font-family:"Segoe UI",Tahoma,sans-serif}
  #wrap{display:flex;flex-direction:column;height:100%;padding:12px;box-sizing:border-box;gap:8px}
  #title{font-size:18px;font-weight:700;text-align:center;min-height:24px}
  #form{display:flex;gap:8px}
  #q{flex:1;min-width:0;background:#171b30;color:#fff;border:1px solid #2b3050;border-radius:8px;padding:8px 12px;font-size:14px;direction:ltr;text-align:left}
  #form button{background:#5865f2;color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
  #player{flex:1;min-height:0;width:100%;background:#000;border-radius:10px}
  #status{font-size:13px;text-align:center;min-height:18px;opacity:.9}
  .bad{color:#ff7a7a}
  #results{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:22vh;overflow:auto}
  #results button{background:#2b3050;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;direction:ltr}
  #results button:hover{background:#3a4170}
  #results button.dim{opacity:.45}
  #foot{font-size:11px;text-align:center;opacity:.6}
  #toggle,#share{display:none;align-self:center;background:#2b3050;color:#fff;border:0;border-radius:8px;padding:4px 14px;cursor:pointer;font-size:12px}
  #wrap.playing{padding:6px;gap:4px}
  #wrap.playing #toggle,#wrap.playing #share:not([hidden]){display:block}
  #sharebox{display:flex;justify-content:center}
  #sharebox[hidden]{display:none!important}
  #wrap.playing #form,#wrap.playing #results,#wrap.playing #status,#wrap.playing #foot,#wrap.playing #sharebox{display:none}
  #wrap.playing.search #sharebox:not([hidden]){display:flex}
  #wrap.playing.search #form,#wrap.playing.search #results,#wrap.playing.search #status{display:flex}
  #wrap.playing.search #status{display:block}
  #wrap.playing.search #player{flex:.5}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">الأفلام</div>
  <div style="display:flex;gap:8px;justify-content:center">
    <button id="toggle" type="button">بحث / إخفاء البحث</button>
    <button id="share" type="button" hidden>مشاركة</button>
  </div>
  <form id="form"><input id="q" placeholder="اكتب اسم الفيلم (عربي أو إنجليزي)" autocomplete="off"><button type="submit">بحث</button></form>
  <div id="status"></div>
  <div id="sharebox" hidden><input id="sharelink" readonly style="width:90%;background:#171b30;color:#9cf;border:1px solid #2b3050;border-radius:8px;padding:6px 10px;font-size:12px;direction:ltr"></div>
  <div id="results"></div>
  <video id="player" controls playsinline preload="metadata"></video>
  <div id="foot">Onyx</div></div>
<script src="movies_app.js?v=19"></script>
</body>
</html>
